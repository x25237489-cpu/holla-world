<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Peter | Personal Page</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: clamp(28px, 7vw, 56px);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .greeting {
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: clamp(1rem, 3vw, 1.2rem);
      margin-bottom: 28px;
    }

    .divider {
      width: 48px;
      height: 4px;
      background: #38bdf8;
      border-radius: 4px;
      margin-bottom: 28px;
    }

    .description {
      color: #e2e8f0;
      font-size: 1.05rem;
      margin-bottom: 36px;
    }

    .footer {
      padding-top: 20px;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    #today {
      color: #7dd3fc;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .card {
        border-radius: 18px;
      }

      .description {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="greeting">Welcome to my page</p>

    <h1>Hi, I'm Peter.</h1>

    <p class="subtitle">
      MSc student, National College of Ireland
    </p>

    <div class="divider" aria-hidden="true"></div>

    <p class="description">
      I'm passionate about using data analytics
      to help businesses detect financial fraud,
      reduce risks, and make better decisions.
    </p>

    <footer class="footer">
      Today's date:
      <time id="today"></time>
    </footer>
  </main>

  <script>
    const today = new Date();

    const formattedDate = today.toLocaleDateString(
      "en-IE",
      {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

    const dateElement = document.getElementById("today");

    dateElement.textContent = formattedDate;

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    dateElement.setAttribute(
      "datetime",
      `${year}-${month}-${day}`
    );
  </script>
</body>
</html>
